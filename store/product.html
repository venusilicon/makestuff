<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>product</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASE
========================================================= */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: 'Quicksand', sans-serif;
  background: #e8b17b;
  color: #232323;
  font-size: 1.5vw;
  padding: 5%;
  letter-spacing: -0.2px;
}

a {
  color: #232323;
}


/* =========================================================
   PRODUCT
========================================================= */

.product-page {
  width: 100%;
}

.product-visual {
  width: 100%;
}

.product-images {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1vw;
}

.product-image {
  width: 100%;
  aspect-ratio: 5 / 4;
  object-fit: cover;
  display: block;
  background: #232323;
  border-radius: 6px;
}

.product-info {
  width: 100%;
  margin-top: 4vw;
  text-align: justify;
  text-justify: inter-word;
  line-height: 1.25;
  white-space: pre-line;
}



.sold-message {
  margin-top: 4vw;
}

.product-error {
  line-height: 1.25;
}

</style>
</head>


<body>
<!-- =======================================================
     PRODUCT
======================================================== -->

<main class="product-page">

  <div class="product-visual">

    <div
      id="product-images"
      class="product-images"
    ></div>

  </div>


  <div
    id="product-info"
    class="product-info"
  ></div>


  <div id="product-action"></div>

</main>


<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

import {
  createClient
} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const SUPABASE_URL =
  "https://ttatoxpeeifoyenlbtro.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_xvtMRTFOnMUcUP9Pm6e1Rg_d1IOag5g";


const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   PRODUCT ELEMENTS
========================================================= */

const imagesContainer =
  document.getElementById('product-images');

const infoContainer =
  document.getElementById('product-info');

const actionContainer =
  document.getElementById('product-action');


/* =========================================================
   PRODUCT ID
========================================================= */

const params =
  new URLSearchParams(window.location.search);

const productId =
  params.get('id');


/* =========================================================
   PRODUCT LOADING
========================================================= */

async function loadProduct() {

  if (!productId) {

    showError();

    return;

  }


  const {
    data: product,
    error
  } = await supabase
    .from('products')
    .select('*')
    .eq('id', productId)
    .single();


  if (
    error ||
    !product
  ) {

    console.error(
      'Could not load product:',
      error
    );

    infoContainer.textContent =
      error
        ? error.message
        : 'No product found for this ID.';

    return;

  }


  renderProduct(product);

}


/* =========================================================
   RENDER PRODUCT
========================================================= */

function renderProduct(product) {

  document.title =
    product.name || 'product';


  renderImages(product);

  renderInfo(product);

  renderAction(product);

}


/* =========================================================
   RENDER IMAGES
========================================================= */

function renderImages(product) {

  imagesContainer.innerHTML = '';


  let images =
    product.images;


  if (
    typeof images === 'string'
  ) {

    try {

      images =
        JSON.parse(images);

    } catch {

      images = [];

    }

  }


  if (
    !Array.isArray(images)
  ) {

    images = [];

  }


  images.forEach(
    image => {

      const img =
        document.createElement('img');


      img.className =
        'product-image';


      const src =
        typeof image === 'string'
          ? image
          : image.src;


      img.src =
        src;


      img.alt =
        product.name || 'product';


      if (
        typeof image === 'object' &&
        image.row != null &&
        image.column != null
      ) {

        img.style.gridRow =
          String(image.row);

        img.style.gridColumn =
          String(image.column);

      }


      imagesContainer.appendChild(
        img
      );

    }
  );

}


/* =========================================================
   RENDER PRODUCT INFO
========================================================= */

function renderInfo(product) {

  const sections = [];


  if (product.name) {

    sections.push(
      String(product.name)
    );

  }


  if (product.price != null) {

    sections.push(
      `$${Number(product.price).toFixed(2)}`
    );

  }


  if (product.description) {

    sections.push(
      String(product.description)
    );

  }


  if (product.materials) {

    sections.push(
      String(product.materials)
    );

  }


if (product.padding_density) {

  sections.push(
    `padding density: ${product.padding_density}`
  );

}


if (product.compression_tolerance) {

  sections.push(
    `compression tolerance: ${product.compression_tolerance}`
  );

}


if (product.shape_retention) {

  sections.push(
    `shape retention: ${product.shape_retention}`
  );

}


  if (product.care_instructions) {

    sections.push(
      String(product.care_instructions)
    );

  }


  infoContainer.textContent =
    sections.join('\n\n');

}


/* =========================================================
   PRODUCT STATUS
========================================================= */

function renderAction(product) {

  actionContainer.innerHTML = '';


  if (
    product.status === 'sold'
  ) {

    actionContainer.innerHTML = `
      <div class="sold-message">
        sold
      </div>
    `;

  }

}

/* =========================================================
   ERROR
========================================================= */

function showError() {

  imagesContainer.innerHTML = '';

  infoContainer.innerHTML = `
    <div class="product-error">
      product could not be found
    </div>
  `;

  actionContainer.innerHTML = '';

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   INITIALIZE
========================================================= */


loadProduct();

</script>

</body>
</html>
