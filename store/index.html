<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>store</title>
<!-- Google Quicksand font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap"
  rel="stylesheet">
<style>
/* =========================================================
   BASE
========================================================= */
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}
*,
*::before,
*::after {
  box-sizing: border-box;
}
body {
  font-family: 'Quicksand', sans-serif;
  background: #e8b17b;
  color: #232323;
  font-size: 1.5vw;
  padding: 5%;
  letter-spacing: -0.2px;
}
a {
  color: #232323;
}
a:hover {
  font-size: 3vw;
}
/* ===== HORIZONTAL SCROLL STRIP (UNCHANGED) ===== */
.scroll-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  gap: 2vw;
  padding: 2vw 0;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  height: calc(10 * 1h);
}
.product {
  flex: 0 0 auto;
  width: 35vw;
  scroll-snap-align: start;
  text-align: justify;
}
.product img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #232323;
  display: block;
  border-radius: 6px;
}
.product-info {
  line-height: 1.25;
}
/* =========================================================
   FOOTER
========================================================= */
footer {
  text-align: right;
  margin-top: 20%;
  font-size: 1.5vw;
  color: #232323;
}
/* =========================================================
   STORE
========================================================= */
.store {
  margin-left: 5%;
  margin-right: 5%;
}
/* =========================================================
   SHOP everything
========================================================= */
.available-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4vw 2vw;
  margin-top: 2vw;
}
.store-product {
  width: 100%;
  text-align: justify;
  position: relative;
}
.store-product-image {
  width: 100%;
  aspect-ratio: 5 / 4;
  object-fit: cover;
  background: none;
  display: block;
  border-radius: none;
}
.store-product-info {
  line-height: 1.25;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1vw;
  margin-top: 0.5vw;
}
.store-product-name {
  text-align: left;
}
.store-product-price {
  text-align: right;
  white-space: nowrap;
}
/* =========================================================
   SOLD PILE
========================================================= */
.sold-pile {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: auto;
  margin-top: 8vw;
  padding: 0;
}
.sold-grid {
  display: grid;
  grid-template-columns: repeat(5, 20vw);
  grid-auto-rows: auto;
  gap: 4vw 2vw;

  width: max-content;
  min-width: 100%;
  min-height: 100%;
}
.sold-product {
  width: 20vw;
  text-align: justify;
}
.sold-product-image {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: #232323;
  display: block;
  border-radius: 6px;
}
.sold-product-info {
  line-height: 1.25;
  margin-top: 0.5vw;
}
/* =========================================================
   STORE LABELS
========================================================= */
.store-section-label {
  margin-top: 4vw;
  margin-bottom: 1vw;
}
/* =========================================================
   EMPTY STATES
========================================================= */
.store-empty {
  line-height: 1.25;
}
</style></head>
<body>

     NAVIGATION
======================================================== -->
<div class="scroll-wrap">
  <div class="product">

    </a></div>

  <div class="product">
    <a href="https://www.patreon.com/cw/venusili">

    </a></div>

  <div class="product">
    <a href="https://kick.com/venusili">
      <img src="kick.png" alt="">
    </a></div>

  <div class="product">
    <a href="https://instagram.com/silimakestuff">
      <img src="ig.png" alt="">
    </a></div>

  <div class="product">
    <a href="https://www.youtube.com/@venusili">

    </a></div>

  <div class="product">
    <a href="https://siliconvenus.online/tip">

  <div class="product">

  <div class="product">

  <div class="product">

<main class="store">

<!-- =======================================================
     SUPABASE
======================================================== -->
<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
/* =========================================================
   SUPABASE CONNECTION
========================================================= */
const SUPABASE_URL =
  "https://ttatoxpeeifoyenlbtro.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_xvtMRTFOnMUcUP9Pm6e1Rg_d1IOag5g";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
/* =========================================================
   ELEMENTS
========================================================= */
const availableGrid =
  document.getElementById('available-grid');

const soldGrid =
  document.getElementById('sold-grid');

const soldPile =
  document.getElementById('sold-pile');

const productMap =
  new Map();
/* =========================================================
   HOTKEYS
========================================================= */
const COPY_EMAIL =
  'moonlight@siliconvenus.online';

document.addEventListener(
  'keydown',
  async event => {

    const tag =
      event.target.tagName;

    if (
      tag === 'INPUT' ||
      tag === 'TEXTAREA' ||
      tag === 'SELECT' ||
      event.target.isContentEditable
    ) {
      return;
    }
    if (event.repeat) {
      return;
    }
    /* -----------------------------------------------------
       M COPY EMAIL
    ----------------------------------------------------- */
    if (
      event.key.toLowerCase() === 'm'
    ) {

      event.preventDefault();
      try {
        await navigator.clipboard.writeText(
          COPY_EMAIL
        );

        console.log(
          'Email copied to clipboard.'
        );

      } catch (error) {
        console.error(
          'Could not copy email:',
          error
        );
      }
      return;
    }
  }
);
/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

  const {
    data,
    error
  } = await supabase
    .from('products')
    .select('*')
    .order(
      'created_at',
      {
        ascending: false
      }
    );


  if (error) {

    console.error(
      'Could not load products:',
      error
    );

    return;

  }


  data.forEach(
    product => {

      productMap.set(
        String(product.id),
        product
      );

    }
  );


  const available =
    data.filter(
      product =>
        product.status ===
        'available'
    );


  const sold =
    data.filter(
      product =>
        product.status ===
        'sold'
    );


  renderAvailable(
    available
  );

  renderSold(
    sold
  );

}


/* =========================================================
   AVAILABLE PRODUCTS
========================================================= */

function renderAvailable(
  products
) {

  availableGrid.innerHTML =
    '';


  if (!products.length) {

    availableGrid.innerHTML = `
      <div class="store-empty">
        nothing currently available
      </div>
    `;

    return;

  }


  products.forEach(
    product => {

      const card =
        document.createElement(
          'div'
        );

      card.className =
        'store-product';


      card.innerHTML = `

        <div
          class="drag-handle"
          data-product-id="${product.id}"
          aria-label="Drag ${escapeHTML(product.name)} to basket"
          role="button"
        >

          <span></span>
          <span></span>
          <span></span>

          <span></span>
          <span></span>
          <span></span>

        </div>


        <a
          href="product.html?id=${encodeURIComponent(product.id)}"
          target="_blank"
          rel="noopener"
        >

          <img
            class="store-product-image"
            src="${product.image_url}"
            alt="${escapeHTML(product.name)}"
          >

        </a>


        <div class="store-product-info">

          <div class="store-product-name">

            <a
              href="product.html?id=${encodeURIComponent(product.id)}"
              target="_blank"
              rel="noopener"
            >
              ${escapeHTML(product.name)}
            </a>

          </div>


          <div class="store-product-price">
            $${Number(product.price).toFixed(2)}
          </div>

        </div>

      `;


      availableGrid.appendChild(
        card
      );

    }
  );
}
/* =========================================================
   SOLD PRODUCTS
========================================================= */
function renderSold(
  products
) {

  soldGrid.innerHTML =
    '';


  if (!products.length) {

    soldPile.style.display =
      'none';

    return;

  }


  soldPile.style.display =
    '';


  products.forEach(
    product => {

      const card =
        document.createElement(
          'div'
        );

      card.className =
        'sold-product';


      card.innerHTML = `

        <a
          href="product.html?id=${encodeURIComponent(product.id)}"
        >

          <img
            class="sold-product-image"
            src="${product.image_url}"
            alt="${escapeHTML(product.name)}"
          >

        </a>


        <div class="sold-product-info">
          <a
            href="product.html?id=${encodeURIComponent(product.id)}"
          >
            ${escapeHTML(product.name)}
          </a>
          <br>
          sold
        </div>
      `;


      soldGrid.appendChild(
        card
      );

    }
  );
}
/* =========================================================
   BASIC HTML ESCAPE
========================================================= */
function escapeHTML(
  value
) {
  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}
/* =========================================================
   START
========================================================= */
loadProducts();
</script></body></html>
