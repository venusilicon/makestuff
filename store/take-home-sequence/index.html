<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>transaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/dahlia/stripe.js"></script>
<style>
html, body { margin:0; padding:0; width:100%; overflow-x:hidden; }
*, *::before, *::after { box-sizing:border-box; }
body { font-family:'Quicksand',sans-serif; background:#e8b17b; color:#232323; font-size:1.5vw; padding:5%; letter-spacing:-0.2px; }
a { color:#232323; }
a:hover { font-size:3vw; }
.transaction { width:100%; position:relative; }
.transaction-items { width:100%; display:grid; grid-template-columns:repeat(5,1fr); gap:4vw 2vw; }
.transaction-item { width:100%; }
.transaction-item-image { width:100%; aspect-ratio:5/4; object-fit:cover; display:block; background:#232323; border-radius:6px; }
.transaction-item-info { margin-top:.5vw; line-height:1.25; display:flex; justify-content:space-between; gap:1vw; }
.transaction-item-name { text-align:left; }
.transaction-item-price { text-align:right; white-space:nowrap; }
.transaction-item-remove { display:block; width:7vw; height:7vw; margin:.5vw auto 0; background:none; border:none; padding:0; cursor:pointer; background-image:url('hand.png'); background-size:contain; background-repeat:no-repeat; background-position:center; transform-origin:center; }
.transaction-item-remove:hover { transform:scale(1.35); }
.transaction-clear-all { position:absolute; top:0; right:0; width:7vw; height:7vw; background:none; border:none; padding:0; cursor:pointer; background-image:url('removal.png'); background-size:contain; background-repeat:no-repeat; background-position:center; z-index:2; transform-origin:top right; }
.transaction-clear-all:hover { transform:scale(1.35); }
.transaction-total { margin-top:8vw; line-height:1.25; }
.transaction-actions { margin-top:4vw; display:flex; gap:3vw; }
.transaction-button { font-family:'Quicksand',sans-serif; font-size:1.5vw; letter-spacing:-.2px; color:#232323; background:none; border:none; padding:0; cursor:pointer; }
.transaction-button:hover { font-size:3vw; }
.transaction-button:disabled { opacity:.45; cursor:default; }
.checkout-section { display:none; width:100%; margin-top:8vw; max-width:700px; }
.checkout-section.visible { display:block; }
.checkout-title { margin-bottom:2vw; }
.email-field { margin-bottom:3vw; }
.email-field label { display:block; margin-bottom:.5vw; }
.email-field input { width:100%; font-family:'Quicksand',sans-serif; font-size:1.5vw; letter-spacing:-.2px; color:#232323; background:transparent; border:none; border-bottom:1px solid #232323; border-radius:0; padding:.5vw 0; outline:none; }
.stripe-block { margin-top:3vw; }
.stripe-label { margin-bottom:1vw; }
.checkout-totals { margin-top:4vw; line-height:1.5; }
.checkout-total-row { display:flex; justify-content:space-between; gap:2vw; }
.checkout-total-row.total { margin-top:1vw; }
.payment-actions { margin-top:4vw; }
.checkout-message { margin-top:2vw; line-height:1.25; }
.transaction-empty { line-height:1.25; }
footer { text-align:right; margin-top:20%; font-size:1.5vw; color:#232323; }
</style>
</head>
<body>
<main class="transaction">
  <button id="clear-all-button" class="transaction-clear-all" type="button" aria-label="Remove all wroughts from basket"></button>
  <div id="transaction-items" class="transaction-items"></div>
  <div id="transaction-total" class="transaction-total"></div>
  <div id="transaction-actions" class="transaction-actions"></div>

  <section id="checkout-section" class="checkout-section">
    <div class="checkout-title">customer information</div>

    <div class="email-field">
      <label for="customer-email">email</label>
      <input id="customer-email" type="email" autocomplete="email" required>
    </div>

    <div class="stripe-block">
      <div class="stripe-label">shipping address</div>
      <div id="shipping-address-element"></div>
    </div>

    <div class="stripe-block">
      <div class="stripe-label">payment</div>
      <div id="payment-element"></div>
    </div>

    <div id="checkout-totals" class="checkout-totals"></div>

    <div class="payment-actions">
      <button id="purchase-button" class="transaction-button" type="button">purchase</button>
    </div>

    <div id="checkout-message" class="checkout-message" aria-live="polite"></div>
  </section>
</main>
<footer>© 2026 venusilicon</footer>
<script>
const STRIPE_PUBLISHABLE_KEY = 'pk_test_51RP8fjRsgaID6T6rQ31P3fe4XIXreROjpd44GsZBdqGk5YgSObo2vfI2TuOpnkABvWGoEob2cZLWuGTG6r2RIKuC00sHNyavyX';
const CHECKOUT_WORKER = 'https://basket.siliconvenus.online';
const BASKET_KEY = 'siliconVenusBasket';
const BASKET_ACTIVITY_KEY = 'siliconVenusBasketActivity';
const BASKET_IDLE_TIME = 49 * 60 * 1000;

const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
let stripeCheckout = null;
let stripeActions = null;
let shippingAddressElement = null;
let paymentElement = null;
let checkoutStarted = false;
let checkoutSessionId = null;

const itemsContainer = document.getElementById('transaction-items');
const totalContainer = document.getElementById('transaction-total');
const actionsContainer = document.getElementById('transaction-actions');
const clearAllButton = document.getElementById('clear-all-button');
const checkoutSection = document.getElementById('checkout-section');
const customerEmail = document.getElementById('customer-email');
const purchaseButton = document.getElementById('purchase-button');
const checkoutMessage = document.getElementById('checkout-message');
const checkoutTotals = document.getElementById('checkout-totals');

function getBasket() {
  const saved = localStorage.getItem(BASKET_KEY);
  if (!saved) return [];
  try {
    const basket = JSON.parse(saved);
    return Array.isArray(basket) ? basket : [];
  } catch {
    return [];
  }
}

function checkBasketExpiration() {
  const basket = getBasket();
  if (!basket.length) return [];
  const lastActivity = Number(localStorage.getItem(BASKET_ACTIVITY_KEY));
  if (lastActivity && Date.now() - lastActivity >= BASKET_IDLE_TIME) {
    localStorage.removeItem(BASKET_KEY);
    localStorage.removeItem(BASKET_ACTIVITY_KEY);
    return [];
  }
  return basket;
}

function updateBasketActivity() {
  if (!getBasket().length) return;
  localStorage.setItem(BASKET_ACTIVITY_KEY, String(Date.now()));
}

['click','input','change','keydown'].forEach(eventName => {
  document.addEventListener(eventName, updateBasketActivity);
});

function saveBasket(basket) {
  localStorage.setItem(BASKET_KEY, JSON.stringify(basket));
  updateBasketActivity();
}

function removeFromBasket(productId) {
  if (checkoutStarted) return;
  const updated = getBasket().filter(item => item.id !== productId);
  if (updated.length) saveBasket(updated);
  else {
    localStorage.removeItem(BASKET_KEY);
    localStorage.removeItem(BASKET_ACTIVITY_KEY);
  }
  renderTransaction();
}

function clearBasket() {
  if (checkoutStarted) return;
  localStorage.removeItem(BASKET_KEY);
  localStorage.removeItem(BASKET_ACTIVITY_KEY);
  renderTransaction();
}

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function showCheckoutMessage(message) {
  checkoutMessage.textContent = message || '';
}

function renderStripeTotals(session) {
  if (!session || !session.total) return;
  const subtotal = session.total.subtotal?.amount ?? '';
  const tax = session.total.taxExclusive?.amount ?? '';
  const total = session.total.total?.amount ?? '';
  checkoutTotals.innerHTML = `
    <div class="checkout-total-row"><span>product</span><span>${escapeHTML(subtotal)}</span></div>
    <div class="checkout-total-row"><span>shipping</span><span>free</span></div>
    <div class="checkout-total-row"><span>tax</span><span>${escapeHTML(tax)}</span></div>
    <div class="checkout-total-row total"><span>total</span><span>${escapeHTML(total)}</span></div>
  `;
}

async function startStripeCheckout() {
  if (checkoutStarted) {
    checkoutSection.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }

  const basket = checkBasketExpiration();
  if (!basket.length) {
    renderTransaction();
    return;
  }

const continueButton = document.getElementById('continue-button');

/* Show customer/private checkout section immediately */
checkoutSection.classList.add('visible');

checkoutSection.scrollIntoView({
  behavior: 'smooth',
  block: 'start'
});

if (continueButton) {
  continueButton.disabled = true;
  continueButton.textContent = 'loading';
}

showCheckoutMessage('');

  try {
    const productIds = basket.map(item => item.id).filter(Boolean);
    if (productIds.length !== basket.length) throw new Error('One or more basket items are missing a product ID.');

    const response = await fetch(`${CHECKOUT_WORKER}/create-checkout-session`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product_ids:productIds, insurance:'no'})
    });
    const data = await response.json();

    console.log('checkout session response:', data);


    if (!response.ok) throw new Error(data.error || 'Checkout Session could not be created.');
if (!data.client_secret) throw new Error('Checkout Session did not return a client secret.');
if (!data.id) throw new Error('Checkout Session did not return an ID.');

checkoutSessionId = data.id;

stripeCheckout = stripe.initCheckoutElementsSdk({
      clientSecret:data.client_secret,
      elementsOptions:{
        appearance:{
          variables:{
            colorPrimary:'#232323',
            colorText:'#232323',
            colorBackground:'#e8b17b',
            fontFamily:'Quicksand, sans-serif',
            borderRadius:'6px'
          }
        },
        syncAddressCheckbox:'shipping'
      }
    });

    const actionsResult = await stripeCheckout.loadActions();
    if (actionsResult.type !== 'success') {
      throw new Error(actionsResult.error?.message || 'Stripe Checkout could not be loaded.');
    }
    stripeActions = actionsResult.actions;

shippingAddressElement = stripeCheckout.createShippingAddressElement({
  display: {
    name: 'full'
  }
});
    shippingAddressElement.mount('#shipping-address-element');

    paymentElement = stripeCheckout.createPaymentElement({layout:'accordion'});
    paymentElement.mount('#payment-element');

    stripeCheckout.on('change', session => {
      renderStripeTotals(session);
    });
    renderStripeTotals(stripeActions.getSession());

    checkoutStarted = true;
    clearAllButton.style.display = 'none';
    document.querySelectorAll('.transaction-item-remove').forEach(button => {
      button.style.display = 'none';
    });
    if (continueButton) continueButton.style.display = 'none';
    checkoutSection.classList.add('visible');
    checkoutSection.scrollIntoView({behavior:'smooth', block:'start'});
  } catch (error) {
    console.error('Checkout initialization error:', error);
    showCheckoutMessage(error.message || 'Checkout could not be loaded.');
    if (continueButton) {
      continueButton.disabled = false;
      continueButton.textContent = 'continue';
    }
  }
}

async function purchase() {
  if (!stripeActions) {
    showCheckoutMessage('Checkout is not ready.');
    return;
  }

  const email = customerEmail.value.trim();
  if (!customerEmail.reportValidity() || !email) return;

  purchaseButton.disabled = true;
  purchaseButton.textContent = 'processing';
  showCheckoutMessage('');

  try {
    const emailResult = await stripeActions.updateEmail(email);
    if (emailResult.type === 'error') throw new Error(emailResult.error?.message || 'Please check your email.');

 const validation = await stripeActions.validateElements();

if (validation.type === 'error') {
  throw new Error(
    validation.error?.message ||
    'Please check your checkout information.'
  );
}

/* ---------------------------------------------------
   ACQUIRE 5-MINUTE PURCHASE LOCK
--------------------------------------------------- */

if (!checkoutSessionId) {
  throw new Error('Checkout Session ID is missing.');
}

const basket = checkBasketExpiration();

if (!basket.length) {
  throw new Error('Your basket is empty.');
}

const productIds =
  basket
    .map(item => item.id)
    .filter(Boolean);

const lockResponse = await fetch(
  `${CHECKOUT_WORKER}/acquire-purchase-lock`,
  {
    method: 'POST',

    headers: {
      'Content-Type': 'application/json'
    },

    body: JSON.stringify({
      product_ids: productIds,
      checkout_session_id: checkoutSessionId
    })
  }
);

const lockData =
  await lockResponse.json();

if (
  !lockResponse.ok ||
  lockData.locked !== true
) {
  throw new Error(
    lockData.error ||
    'One or more wroughts are currently being purchased by someone else.'
  );
}

/* ---------------------------------------------------
   LOCK ACQUIRED — CONFIRM PAYMENT
--------------------------------------------------- */

const result = await stripeActions.confirm();

if (result.type === 'error') {

  try {
    await fetch(
      `${CHECKOUT_WORKER}/release-purchase-lock`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          product_ids: productIds,
          checkout_session_id: checkoutSessionId
        })
      }
    );
  } catch (releaseError) {
    console.error(
      'Purchase lock release error:',
      releaseError
    );
  }

  throw new Error(
    result.error?.message ||
    'Payment could not be completed.'
  );
}
    if (result.session?.status?.type === 'complete') {
      showCheckoutMessage('payment completed');
    }
  } catch (error) {
    console.error('Checkout confirmation error:', error);
    showCheckoutMessage(error.message || 'Payment could not be completed.');
    purchaseButton.disabled = false;
    purchaseButton.textContent = 'purchase';
  }
}

function renderTransaction() {
  const basket = checkBasketExpiration();
  itemsContainer.innerHTML = '';
  totalContainer.innerHTML = '';
  actionsContainer.innerHTML = '';
  clearAllButton.style.display = basket.length && !checkoutStarted ? 'block' : 'none';

  if (!basket.length) {
    checkoutSection.classList.remove('visible');
    itemsContainer.innerHTML = '<div class="transaction-empty">basket is empty</div>';
    actionsContainer.innerHTML = '<a href="/store/" class="transaction-button">back to store</a>';
    return;
  }

  let total = 0;
  basket.forEach(item => {
    const price = Number(item.price) || 0;
    total += price;
    const wrapper = document.createElement('div');
    wrapper.className = 'transaction-item';
    wrapper.innerHTML = `
      <img class="transaction-item-image" src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.name)}">
      <div class="transaction-item-info">
        <div class="transaction-item-name">${escapeHTML(item.name)}</div>
        <div class="transaction-item-price">$${price.toFixed(2)}</div>
      </div>
      <button class="transaction-item-remove" type="button" data-product-id="${escapeHTML(item.id)}" aria-label="Remove ${escapeHTML(item.name)} from basket"></button>
    `;
    itemsContainer.appendChild(wrapper);
  });

  document.querySelectorAll('.transaction-item-remove').forEach(button => {
    button.addEventListener('click', () => removeFromBasket(button.dataset.productId));
  });

  totalContainer.innerHTML = `total<br>$${total.toFixed(2)}`;
  actionsContainer.innerHTML = `
    <a href="index.html" class="transaction-button">back to store</a>
    <button id="continue-button" class="transaction-button" type="button">continue</button>
  `;
  document.getElementById('continue-button').addEventListener('click', startStripeCheckout);
}

clearAllButton.addEventListener('click', clearBasket);
purchaseButton.addEventListener('click', purchase);
renderTransaction();
</script>
</body>
</html>
