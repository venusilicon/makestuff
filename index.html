<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>silicon venus</title>


<style>

/* =========================================================
   FONT
========================================================= */

@font-face {

  font-family: EpiceneDisplay;

  src: url('EpiceneDisplay-Light.otf')
       format('opentype');

}


/* =========================================================
   BASE
========================================================= */

html,
body {

  max-width: 100%;

  overflow-x: hidden;

}


body {

  margin: 0;

  background: #e8b17b;

  color: #0073ce;

  font-family: EpiceneDisplay;

  font-size: 3vw;

  padding: 5%;

  box-sizing: border-box;

}


/* =========================================================
   MENU
========================================================= */

.menu-button {

  position: fixed;

  top: 4%;

  right: 5%;

  z-index: 20;

  border: none;

  background: transparent;

  padding: 0;

  margin: 0;

  color: #232323;

  font-family: EpiceneDisplay;

  font-size: 3vw;

  cursor: pointer;

}


.menu-button:hover {

  font-size: 5vw;

}


/* =========================================================
   MENU PANEL
========================================================= */

.menu-panel {

  position: fixed;

  top: 9%;

  right: 5%;

  z-index: 19;

  display: none;

  flex-direction: column;

  align-items: flex-end;

  gap: 1.2vw;

  text-align: right;

}


.menu-panel.open {

  display: flex;

}


.menu-link {

  color: #232323;

  text-decoration: none;

  font-size: 2.8vw;

}


.menu-link:hover {

  font-size: 5vw;

}


/* =========================================================
   MENU CLOSE
========================================================= */

.menu-close {

  margin-top: 4vw;

  border: none;

  background: transparent;

  padding: 0;

  color: #232323;

  font-family: EpiceneDisplay;

  font-size: 2.8vw;

  cursor: pointer;

}


.menu-close:hover {

  font-size: 5vw;

}


/* =========================================================
   MATERIAL LOG
========================================================= */

.log-wrapper {

  width: min(90%, 900px);

  margin: 8% auto 0;

}


/* =========================================================
   HEADER
========================================================= */

.log-header {

  width: 100%;

  margin: 0 0 10%;

  text-align: left;

}


.log-title {

  font-size: 7vw;

  line-height: 1;

  margin: 0;

}


.log-subtitle {

  font-size: 3vw;

  margin-top: 2%;

  color: #FE5D8D;

}


/* =========================================================
   ONLINE STATUS
========================================================= */

.online-status {

  display: flex;

  align-items: center;

  gap: .7vw;

  margin-top: 1.5%;

  color: #FE5D8D;

  font-size: 2vw;

}


.online-dot {

  width: .65em;

  height: .65em;

  border-radius: 50%;

  background: #FE5D8D;

  animation: onlinePulse 2s ease-in-out infinite;

}


@keyframes onlinePulse {

  0% {

    opacity: 1;

    transform: scale(1);

  }

  50% {

    opacity: .35;

    transform: scale(.72);

  }

  100% {

    opacity: 1;

    transform: scale(1);

  }

}


/* =========================================================
   MONTH
========================================================= */

.month-heading {

  width: 90%;

  margin: 12% auto 5%;

  text-align: center;

  color: #FE5D8D;

  font-size: 3vw;

}


.month-heading::before,
.month-heading::after {

  content: "";

  display: inline-block;

  width: 15%;

  height: 1px;

  background: #FE5D8D;

  vertical-align: middle;

  margin: 0 3%;

}


/* =========================================================
   CHAT
========================================================= */

.chat {

  width: 100%;

  margin: 0 auto;

  display: flex;

  flex-direction: column;

  gap: 5vw;

}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-log {

  text-align: center;

  color: #FE5D8D;

  font-size: 3vw;

  margin: 15% 0;

}


/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row {

  width: 100%;

  display: flex;

  align-items: flex-end;

  gap: 1.5vw;

}


.message-row.left {

  justify-content: flex-start;

}


.message-row.right {

  justify-content: flex-end;

}


/* =========================================================
   TIMESTAMP
========================================================= */

.timestamp {

  writing-mode: vertical-rl;

  transform: rotate(180deg);

  color: #FE5D8D;

  font-size: 1.7vw;

  white-space: nowrap;

  letter-spacing: .03em;

  flex-shrink: 0;

}


/* =========================================================
   MESSAGE
========================================================= */

.message {

  width: fit-content;

  max-width: 65%;

  min-width: 18%;

  padding: 4% 5%;

  box-sizing: border-box;

  background: #e8b17b;

  border-radius: 24px;

  box-shadow:

    0 18px 35px rgba(0,0,0,.18),

    0 5px 12px rgba(0,0,0,.08);

  text-align: left;

  line-height: 1.25;

}


.message-text {

  margin: 0;

  white-space: pre-wrap;

  word-wrap: break-word;

}


/* =========================================================
   TYPING INDICATOR
========================================================= */

.typing-indicator {

  min-height: 1.2em;

  margin-top: 5%;

  color: #8f3d4d;

  font-size: 2vw;

  opacity: 0;

  transition: opacity .2s ease;

}


.typing-indicator.visible {

  opacity: 1;

}


/* =========================================================
   COMPOSER
========================================================= */

.composer-wrapper {

  width: 100%;

  margin: 8% auto 5%;

}


/* =========================================================
   TEXT BOX
========================================================= */

.composer-textarea {

  display: block;

  width: 100%;

  min-height: 130px;

  box-sizing: border-box;

  padding: 5%;

  background: #e8b17b;

  color: #FE5D8D;

  border: none;

  outline: none;

  border-radius: 24px;

  font-family: EpiceneDisplay;

  font-size: 3vw;

  line-height: 1.25;

  resize: vertical;

  box-shadow:

    0 18px 35px rgba(0,0,0,.18),

    0 5px 12px rgba(0,0,0,.08);

}


.composer-textarea::placeholder {

  color: #FE5D8D;

  opacity: .65;

}


.composer-textarea:focus {

  box-shadow:

    0 22px 42px rgba(0,0,0,.22),

    0 6px 15px rgba(0,0,0,.1);

}


/* =========================================================
   COMPOSER CONTROLS
========================================================= */

.composer-controls {

  display: flex;

  align-items: center;

  justify-content: flex-end;

  margin-top: 3%;

}


/* =========================================================
   BUTTON
========================================================= */

.composer-button {

  border: none;

  background: transparent;

  color: #232323;

  font-family: EpiceneDisplay;

  font-size: 2.5vw;

  cursor: pointer;

  padding: 1%;

}


.composer-button:hover {

  font-size: 5vw;

}


/* =========================================================
   LOGIN STATE
========================================================= */

.login-help {

  margin-top: 3%;

  color: #0073ce;

  font-size: 2vw;

  opacity: .8;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

  text-align: right;

  margin-top: 20%;

  margin-right: 5%;

  font-size: 2.5vw;

  color: #0073ce;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  body {

    padding: 5%;

    font-size: 5vw;

  }


  .menu-button {

    top: 5%;

    right: 6%;

    font-size: 5vw;

  }


  .menu-panel {

    top: 12%;

    right: 6%;

    gap: 3vw;

  }


  .menu-link,
  .menu-close {

    font-size: 5vw;

  }


  .menu-close {

    margin-top: 7vw;

  }


  .log-wrapper {

    width: 94%;

    margin-top: 18%;

  }


  .log-title {

    font-size: 11vw;

  }


  .log-subtitle {

    font-size: 5vw;

  }


  .online-status {

    font-size: 4vw;

  }


  .month-heading {

    font-size: 4vw;

  }


  .chat {

    gap: 8vw;

  }


  .message {

    max-width: 72%;

    min-width: 25%;

    padding: 6% 7%;

    border-radius: 20px;

  }


  .timestamp {

    font-size: 3vw;

  }


  .typing-indicator {

    font-size: 4vw;

  }


  .composer-textarea {

    min-height: 120px;

    font-size: 5vw;

    border-radius: 20px;

  }


  .composer-button {

    font-size: 5vw;

  }


  .login-help {

    font-size: 4vw;

  }


  footer {

    font-size: 4vw;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     MENU
======================================================== -->

<button
  id="menuButton"
  class="menu-button"
  onclick="toggleMenu()"
>

  menu

</button>


<nav
  id="menuPanel"
  class="menu-panel"
>

  <a
    href="store.html"
    class="menu-link"
  >
    store
  </a>


  <a
    href="socials.html"
    class="menu-link"
  >
    socials
  </a>


  <a
    href="about.html"
    class="menu-link"
  >
    about
  </a>


  <a
    href="information.html"
    class="menu-link"
  >
    information
  </a>


  <a
    href="giftme.html"
    class="menu-link"
  >
    gift me
  </a>


  <button
    class="menu-close"
    onclick="closeMenu()"
  >

    X

  </button>

</nav>



<!-- =======================================================
     MATERIAL LOG
======================================================== -->

<main class="log-wrapper">


<header class="log-header">

  <h1 class="log-title">
    convo material log
  </h1>


  <div class="log-subtitle">
    silicon venus
  </div>


  <div class="online-status">

    <span class="online-dot"></span>

    <span>online</span>

  </div>

</header>



<!-- =======================================================
     CHAT
======================================================== -->

<div
  id="workLog"
  class="chat"
>

  <div
    class="empty-log"
    id="emptyLog"
  >

    no entries yet

  </div>

</div>



<!-- =======================================================
     TYPING INDICATOR
======================================================== -->

<div
  id="typingIndicator"
  class="typing-indicator"
>

  typing.

</div>



<!-- =======================================================
     COMPOSER
======================================================== -->

<section class="composer-wrapper">


<textarea
  id="entryText"
  class="composer-textarea"
  placeholder="venus make stuff"
></textarea>


<div
  id="loginHelp"
  class="login-help"
></div>


<div class="composer-controls">


<button
  id="sendButton"
  class="composer-button"
  onclick="handleComposerAction()"
>

  send code →

</button>


</div>

</section>



</main>



<!-- =======================================================
     FOOTER
======================================================== -->

<footer>

  © 2026 venusilicon

</footer>



<!-- =======================================================
     SUPABASE
======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://ttatoxpeeifoyenlbtro.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_xvtMRTFOnMUcUP9Pm6e1Rg_d1IOag5g";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let authStep = "email";

let loginEmail = "";

let typingTimer = null;

let typingAnimationTimer = null;


/* =========================================================
   MENU
========================================================= */

function toggleMenu() {

  const panel =
    document.getElementById("menuPanel");

  const button =
    document.getElementById("menuButton");


  panel.classList.toggle("open");


  if (panel.classList.contains("open")) {

    button.style.visibility = "hidden";

  }

  else {

    button.style.visibility = "visible";

  }

}


function closeMenu() {

  document
    .getElementById("menuPanel")
    .classList.remove("open");

  document
    .getElementById("menuButton")
    .style.visibility = "visible";

}


/* =========================================================
   CLOSE MENU OUTSIDE
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const panel =
      document.getElementById("menuPanel");

    const button =
      document.getElementById("menuButton");


    if (
      panel.classList.contains("open") &&
      !panel.contains(event.target) &&
      !button.contains(event.target)
    ) {

      closeMenu();

    }

  }
);


/* =========================================================
   AUTH
========================================================= */

async function checkSession() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    console.error(error);

    return;

  }


  if (data.session) {

    setLoggedIn();

  }

  else {

    setLoginState();

  }

}


function setLoginState() {

  authStep = "email";

  const textarea =
    document.getElementById("entryText");

  const button =
    document.getElementById("sendButton");

  const help =
    document.getElementById("loginHelp");


  textarea.value = "";

  textarea.placeholder =
    "venus make stuff";

  button.textContent =
    "send code →";

  help.textContent =
    "";

}


function setLoggedIn() {

  authStep = "entry";

  const textarea =
    document.getElementById("entryText");

  const button =
    document.getElementById("sendButton");

  const help =
    document.getElementById("loginHelp");


  textarea.value = "";

  textarea.placeholder =
    "hey sili";

  button.textContent =
    "send →";

  help.textContent = "";

  loadEntries();

}


/* =========================================================
   SEND LOGIN CODE
========================================================= */

async function sendCode() {

  const textarea =
    document.getElementById("entryText");


  const email =
    textarea.value.trim();


  if (!email) {

    return;

  }


  loginEmail = email;


  const button =
    document.getElementById("sendButton");

  const help =
    document.getElementById("loginHelp");


  button.disabled = true;

  button.textContent =
    "sending...";


  const {
    error
  } =
    await supabaseClient.auth.signInWithOtp({

      email: email

    });


  button.disabled = false;


  if (error) {

    console.error(error);

    button.textContent =
      "send code →";

    help.textContent =
      "could not send code";

    return;

  }


  authStep = "code";

  textarea.value = "";

  textarea.placeholder =
    "enter code";

  button.textContent =
    "verify →";

  help.textContent =
    "awaits code";

}


/* =========================================================
   VERIFY CODE
========================================================= */

async function verifyCode() {

  const textarea =
    document.getElementById("entryText");


  const code =
    textarea.value.trim();


  if (!code) {

    return;

  }


  const button =
    document.getElementById("sendButton");

  const help =
    document.getElementById("loginHelp");


  button.disabled = true;

  button.textContent =
    "checking...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.verifyOtp({

      email: loginEmail,

      token: code,

      type: "email"

    });


  button.disabled = false;


  if (error) {

    console.error(error);

    button.textContent =
      "verify →";

    help.textContent =
      "that code did not work";

    return;

  }


  if (data.session) {

    setLoggedIn();

  }

}


/* =========================================================
   COMPOSER ACTION
========================================================= */

function handleComposerAction() {

  if (authStep === "email") {

    sendCode();

    return;

  }


  if (authStep === "code") {

    verifyCode();

    return;

  }


  sendEntry();

}


/* =========================================================
   LOAD ENTRIES
========================================================= */

async function loadEntries() {

  const {
    data,
    error
  } =
    await supabaseClient

      .from("convo material log")

      .select(
        "id, created_at, project"
      )

      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  renderEntries(data || []);

}


/* =========================================================
   RENDER ENTRIES
========================================================= */

function renderEntries(entries) {

  const log =
    document.getElementById("workLog");


  log.innerHTML = "";


  if (!entries.length) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty-log";

    empty.textContent =
      "no entries yet";

    log.appendChild(empty);

    return;

  }


  let previousMonth = "";

  let messageIndex = 0;


  entries.forEach(
    function(entry) {

      const date =
        new Date(entry.created_at);


      const month =
        date.toLocaleDateString(
          [],
          {
            month: "long",
            year: "numeric"
          }
        );


      if (month !== previousMonth) {

        const heading =
          document.createElement("div");

        heading.className =
          "month-heading";

        heading.textContent =
          month;


        log.appendChild(
          heading
        );


        previousMonth =
          month;

      }


      const row =
        document.createElement("div");


      const side =
        messageIndex % 2 === 0
          ? "left"
          : "right";


      row.className =
        "message-row " + side;


      const message =
        document.createElement("div");


      message.className =
        "message";


      const paragraph =
        document.createElement("p");


      paragraph.className =
        "message-text";


      paragraph.textContent =
        entry.project || "";


      message.appendChild(
        paragraph
      );


      const timestamp =
        document.createElement("div");


      timestamp.className =
        "timestamp";


      timestamp.textContent =
        formatTimestamp(date);


      if (side === "left") {

        row.appendChild(
          timestamp
        );

        row.appendChild(
          message
        );

      }

      else {

        row.appendChild(
          message
        );

        row.appendChild(
          timestamp
        );

      }


      log.appendChild(
        row
      );


      messageIndex++;

    }
  );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function formatTimestamp(date) {

  const datePart =
    date.toLocaleDateString(
      [],
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    );


  const timePart =
    date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );


  return datePart + " · " + timePart;

}


/* =========================================================
   SEND ENTRY
========================================================= */

async function sendEntry() {

  const textarea =
    document.getElementById("entryText");


  const text =
    textarea.value.trim();


  if (!text) {

    return;

  }


  const button =
    document.getElementById("sendButton");


  button.disabled = true;

  button.textContent =
    "sending...";


  const {
    error
  } =
    await supabaseClient

      .from("convo material log")

      .insert({

        project: text

      });


  button.disabled = false;

  button.textContent =
    "send →";


  if (error) {

    console.error(error);

    return;

  }


  textarea.value = "";


  stopTypingAnimation();


  await loadEntries();

}


/* =========================================================
   TYPING ANIMATION
========================================================= */

function startTypingAnimation() {

  const indicator =
    document.getElementById(
      "typingIndicator"
    );


  let dots = 1;


  indicator.textContent =
    "typing.";


  indicator.classList.add(
    "visible"
  );


  clearInterval(
    typingAnimationTimer
  );


  typingAnimationTimer =
    setInterval(
      function() {

        dots++;


        if (dots > 3) {

          dots = 1;

        }


        indicator.textContent =
          "typing" +
          ".".repeat(dots);

      },
      450
    );

}


function stopTypingAnimation() {

  const indicator =
    document.getElementById(
      "typingIndicator"
    );


  clearInterval(
    typingAnimationTimer
  );


  indicator.classList.remove(
    "visible"
  );

}


/* =========================================================
   TEXT INPUT
========================================================= */

document
  .getElementById("entryText")
  .addEventListener(
    "input",
    function() {

      if (authStep !== "entry") {

        return;

      }


      startTypingAnimation();


      clearTimeout(
        typingTimer
      );


      typingTimer =
        setTimeout(
          function() {

            stopTypingAnimation();

          },
          1200
        );

    }
  );


/* =========================================================
   ENTER KEY
========================================================= */

document
  .getElementById("entryText")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        handleComposerAction();

      }

    }
  );


/* =========================================================
   AUTH STATE CHANGES
========================================================= */

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    if (session) {

      setLoggedIn();

    }

    else {

      setLoginState();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

checkSession();

</script>


</body>

</html>
