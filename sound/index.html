<style>
/* =========================================================
   BASE
========================================================= */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  text-align: justify;
  text-justify: inter-word;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  font-family: 'Quicksand', sans-serif;
  background: #e8b17b;
  color: #232323;
  font-size: 1.5vw;
  padding: 5%;
  letter-spacing: -0.2px;
}

/* ===== HORIZONTAL SCROLL STRIP (UNCHANGED) ===== */
.scroll-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  gap: 2vw;
  padding: 2vw 0;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  height: calc(10 * 1h);
}

.product {
  flex: 0 0 auto;
  width: 35vw;
  scroll-snap-align: start;
  text-align: justify;
}

.about {
  font-size: 1vw;
}

.product img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #232323;
  display: block;
  border-radius: 6px;
}

.product-info {
  line-height: 1.25;
}

.visual {
  width: 20vw;
display: block;
  margin-left: auto;
}

a {
  color: #232323;;
}

a:hover {
  font-size: 3vw;
}
/* =========================================================
   RESPONSIVE 5-COLUMN GRID
========================================================= */

.sound-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2vw;
  width: 100%;
  
}

.sound-track {
  width: 100%;
}

.sound-track img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #232323;
  display: block;
  border-radius: 6px;
}

/* Responsive */
@media (max-width: 800px) {
  .sound-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 500px) {
  .sound-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
/* =========================================================
   FOOTER
========================================================= */

footer {
  text-align: right;
  margin-top: 20%;
  font-size: 1.5vw;
  color: #232323;
}
</style>
</head>
